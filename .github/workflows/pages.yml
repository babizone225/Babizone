# Construit la version navigateur (mobile + PC) avec pygbag et la publie sur GitHub Pages.
# Déclenché à chaque "git push" sur la branche main.
name: Publier le jeu (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer pygbag
        run: python -m pip install --upgrade pip pygbag
      - name: Construire la version web
        run: python -m pygbag --build .
      - name: Contenu construit (pour le diagnostic)
        run: ls -la build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
