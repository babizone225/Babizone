# Construit Babizone.exe (Windows) et le met en téléchargement dans l'onglet "Releases".
# Déclenché quand tu crées une étiquette de version :  git tag v0.6-test  puis  git push origin v0.6-test
name: Construire le .exe Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: python -m pip install --upgrade pip pygame-ce pyinstaller
      - name: Construire l'exécutable
        run: python -m PyInstaller --noconfirm --onefile --windowed --name Babizone --add-data "sounds;sounds" main.py
      - name: Créer le ZIP
        run: Compress-Archive -Path dist/Babizone.exe -DestinationPath Babizone-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Babizone-windows
          path: Babizone-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Babizone-windows.zip
